# AI Office Desktop — Windows exe 빌드.
# desktop/ 아래가 바뀌면 테스트 후 exe를 만들어 아티팩트로 올린다.
# desktop-v* 태그를 달면 GitHub 릴리스에 exe를 붙여 배포한다.
name: Desktop build (Windows)

on:
  push:
    branches: ["**"]
    paths: ["desktop/**", ".github/workflows/desktop-build.yml"]
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: read   # 빌드는 읽기만. 릴리스 단계만 쓰기 권한

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 의존성
        run: python -m pip install --upgrade pip pyinstaller -r requirements.txt
      - name: 테스트 (가짜 AI로 전체 흐름)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"
          python -m unittest -v tests/test_desktop.py tests/test_modes.py
      - name: exe 만들기
        run: pyinstaller --noconfirm --onefile --windowed --icon app.ico --name AIOfficeDesktop --version-file version_info.txt --add-data "aio_desktop/static;aio_desktop/static" --hidden-import keyring.backends.Windows run.py
      - name: exe 자체 점검
        shell: pwsh
        run: |
          # 창 모드 exe는 PowerShell이 끝나길 기다리지 않으므로 -Wait로 종료 코드를 받는다
          $p = Start-Process -FilePath dist\AIOfficeDesktop.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:APPDATA\AIOfficeDesktop\log.txt" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "selftest failed: $($p.ExitCode)" }
      - name: 앱 창 점검 (Edge 앱 모드로 화면이 실제로 뜨는지)
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\AIOfficeDesktop.exe -ArgumentList "--smoketest","--headless" -Wait -PassThru
          Get-Content "$env:APPDATA\AIOfficeDesktop\log.txt" -Tail 5 -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "smoketest failed: $($p.ExitCode)" }
      - name: 설치 파일 만들기 (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $env:AIO_VERSION = (python -c "import aio_desktop;print(aio_desktop.__version__)")
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - name: SHA-256 (받은 파일이 진짜인지 확인용)
        shell: pwsh
        run: |
          foreach ($f in "AIOfficeDesktop.exe", "AIOfficeDesktop-Setup.exe") {
            $h = (Get-FileHash "dist\$f" -Algorithm SHA256).Hash
            "$h  $f" | Out-File -Encoding ascii "dist\$f.sha256"
            Write-Host "SHA256 $f $h"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: AIOfficeDesktop-windows
          path: |
            desktop/dist/AIOfficeDesktop.exe
            desktop/dist/AIOfficeDesktop.exe.sha256
            desktop/dist/AIOfficeDesktop-Setup.exe
            desktop/dist/AIOfficeDesktop-Setup.exe.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AIOfficeDesktop-windows
          path: dist
      - name: 릴리스
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/AIOfficeDesktop-Setup.exe dist/AIOfficeDesktop-Setup.exe.sha256 dist/AIOfficeDesktop.exe dist/AIOfficeDesktop.exe.sha256 --title "AI Office Desktop ${GITHUB_REF_NAME#desktop-v}" --notes-file desktop/README.md
